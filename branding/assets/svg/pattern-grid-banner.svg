<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <!-- banner survey grid: 1200×300 for page-wide hero/topo banners -->
  <rect width="1200" height="300" fill="#F1EAD9"/>
  <g stroke="#3A5A3E" stroke-width="0.5" opacity=".15">
    <!-- minor grid: every 20px -->
    <path d="M0 20 H1200 M0 40 H1200 M0 60 H1200 M0 80 H1200 M0 100 H1200 M0 120 H1200 M0 140 H1200 M0 160 H1200 M0 180 H1200 M0 200 H1200 M0 220 H1200 M0 240 H1200 M0 260 H1200 M0 280 H1200 M0 300 H1200"/>
    <path d="M20 0 V300 M40 0 V300 M60 0 V300 M80 0 V300 M100 0 V300 M120 0 V300 M140 0 V300 M160 0 V300 M180 0 V300 M200 0 V300 M220 0 V300 M240 0 V300 M260 0 V300 M280 0 V300 M300 0 V300 M320 0 V300 M340 0 V300 M360 0 V300 M380 0 V300 M400 0 V300 M420 0 V300 M440 0 V300 M460 0 V300 M480 0 V300 M500 0 V300 M520 0 V300 M540 0 V300 M560 0 V300 M580 0 V300 M600 0 V300 M620 0 V300 M640 0 V300 M660 0 V300 M680 0 V300 M700 0 V300 M720 0 V300 M740 0 V300 M760 0 V300 M780 0 V300 M800 0 V300 M820 0 V300 M840 0 V300 M860 0 V300 M880 0 V300 M900 0 V300 M920 0 V300 M940 0 V300 M960 0 V300 M980 0 V300 M1000 0 V300 M1020 0 V300 M1040 0 V300 M1060 0 V300 M1080 0 V300 M1100 0 V300 M1120 0 V300 M1140 0 V300 M1160 0 V300 M1180 0 V300"/>
  </g>
  <g stroke="#3A5A3E" stroke-width="0.8" opacity=".28">
    <!-- major grid: every 100px -->
    <path d="M0 100 H1200 M0 200 H1200"/>
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300"/>
  </g>
  <!-- corner registration ticks -->
  <g stroke="#2A3327" stroke-width="1.2" fill="none">
    <path d="M8 8 L8 20 M8 8 L20 8"/>
    <path d="M1192 8 L1192 20 M1192 8 L1180 8"/>
    <path d="M8 292 L8 280 M8 292 L20 292"/>
    <path d="M1192 292 L1192 280 M1192 292 L1180 292"/>
  </g>
</svg>