<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- aaen studios — OG social preview. 1200x630 standard.
       lands the thesis in one frame: "map the terrain before you build". -->
  <rect width="1200" height="630" fill="#F1EAD9"/>

  <!-- atmospheric contour field, lower-right -->
  <g fill="none" stroke="#3A5A3E" stroke-width="1.3" transform="translate(880,440)" opacity=".55">
    <ellipse cx="0" cy="0" rx="55" ry="44" opacity=".5"/>
    <ellipse cx="0" cy="0" rx="110" ry="88" opacity=".4"/>
    <ellipse cx="0" cy="0" rx="165" ry="132" opacity=".3"/>
    <ellipse cx="0" cy="0" rx="220" ry="176" opacity=".22"/>
    <ellipse cx="0" cy="0" rx="275" ry="220" opacity=".15"/>
    <ellipse cx="0" cy="0" rx="330" ry="264" opacity=".09"/>
  </g>
  <!-- secondary summit upper-right -->
  <g fill="none" stroke="#3A5A3E" stroke-width="1.1" transform="translate(1080,150)" opacity=".35">
    <ellipse cx="0" cy="0" rx="30" ry="24" opacity=".5"/>
    <ellipse cx="0" cy="0" rx="60" ry="48" opacity=".4"/>
    <ellipse cx="0" cy="0" rx="90" ry="72" opacity=".3"/>
  </g>

  <!-- summit crosshair on main peak -->
  <g stroke="#C8782A" stroke-width="2" fill="none" transform="translate(880,440)">
    <path d="M-12 0 L12 0 M0 -12 L0 12"/>
  </g>

  <!-- mark -->
  <g transform="translate(100,96) scale(2.4)" fill="none">
    <path d="M24 6 C32 6 40 14 40 22 C40 30 32 34 24 34 C16 34 8 30 8 22 C8 14 16 6 24 6 Z" stroke="#3A5A3E" stroke-width="1.1" opacity=".35"/>
    <path d="M24 10 C30 10 36 16 36 22 C36 28 30 31 24 31 C18 31 12 28 12 22 C12 16 18 10 24 10 Z" stroke="#3A5A3E" stroke-width="1.1" opacity=".55"/>
    <path d="M24 14 C28 14 32 18 32 22 C32 26 28 28 24 28 C20 28 16 26 16 22 C16 18 20 14 24 14 Z" stroke="#3A5A3E" stroke-width="1.1" opacity=".8"/>
    <ellipse cx="24" cy="22" rx="4" ry="3.5" fill="#3A5A3E"/>
  </g>
  <text x="170" y="170" font-family="Fraunces, Georgia, serif" font-size="40" font-weight="500" fill="#2A3327">aaen<tspan fill="#3A5A3E" font-style="italic">.</tspan></text>

  <!-- the thesis -->
  <text x="100" y="330" font-family="Fraunces, Georgia, serif" font-size="78" font-weight="400" fill="#2A3327" letter-spacing="-2">Map the terrain</text>
  <text x="100" y="420" font-family="Fraunces, Georgia, serif" font-size="78" font-weight="400" fill="#2A3327" letter-spacing="-2"><tspan font-style="italic" fill="#3A5A3E">before</tspan> you build.</text>

  <!-- descriptor -->
  <text x="100" y="500" font-family="Inter, sans-serif" font-size="26" fill="#5A6647">aaen studios — a software studio that reads the landscape first.</text>

  <!-- bottom rule + sheet meta -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#B8B3A0" stroke-width="1"/>
  <text x="100" y="585" font-family="JetBrains Mono, monospace" font-size="14" fill="#8A8772" letter-spacing="2">EST. 2024</text>
  <text x="1100" y="585" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="14" fill="#8A8772" letter-spacing="2">SHEET 01/07 · N 51.5°</text>
</svg>
