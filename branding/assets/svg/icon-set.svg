<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120">
  <!-- aaen icon family — 6 icons, 24x24 grid, contour-line language
       stroke 1.5px, round caps, moss #3A5A3E. each does one job. -->
  <g fill="none" stroke="#3A5A3E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- compass -->
    <g transform="translate(20,20)">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 5 L14 12 L12 19 L10 12 Z" fill="#3A5A3E" stroke="none"/>
      <path d="M5 12 L12 10 L19 12 L12 14 Z" fill="#B5895A" stroke="none" opacity=".7"/>
    </g>
    <!-- map -->
    <g transform="translate(140,20)">
      <path d="M3 6 L9 4 L15 6 L21 4 L21 18 L15 20 L9 18 L3 20 Z"/>
      <path d="M9 4 L9 18 M15 6 L15 20"/>
    </g>
    <!-- trail / route -->
    <g transform="translate(260,20)">
      <circle cx="6" cy="6" r="2"/>
      <circle cx="18" cy="18" r="2"/>
      <path d="M6 8 C6 12 18 10 18 16"/>
    </g>
    <!-- summit / peak -->
    <g transform="translate(380,20)">
      <path d="M3 19 L9 8 L13 13 L16 6 L21 19 Z"/>
      <path d="M9 8 L11 11 M16 6 L14 9" opacity=".5"/>
    </g>
    <!-- coordinates / waypoint -->
    <g transform="translate(500,20)">
      <path d="M12 2 C7 2 4 5 4 9 C4 14 12 22 12 22 C12 22 20 14 20 9 C20 5 17 2 12 2 Z"/>
      <circle cx="12" cy="9" r="2.5"/>
    </g>
    <!-- sheet / document -->
    <g transform="translate(620,20)">
      <path d="M5 3 L15 3 L19 7 L19 21 L5 21 Z"/>
      <path d="M15 3 L15 7 L19 7"/>
      <path d="M8 12 L16 12 M8 16 L14 16" opacity=".6"/>
    </g>
  </g>
  <!-- baseline labels -->
  <g font-family="JetBrains Mono, monospace" font-size="9" fill="#8A8772" text-anchor="middle" letter-spacing="1">
    <text x="32" y="110">compass</text>
    <text x="152" y="110">terrain</text>
    <text x="272" y="110">route</text>
    <text x="392" y="110">summit</text>
    <text x="512" y="110">waypoint</text>
    <text x="632" y="110">sheet</text>
  </g>
</svg>
