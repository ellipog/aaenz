<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Gjøvik Fysioterapi favicon — the "Kraft" performance-lab readout.
    An ECG/heartbeat trace: the clinic reads as an instrumented environment
    (a performance lab, not a hospital), so the mark is a live telemetry line
    rather than a medical cross. This is the clinic's standalone identity
    (concept 03), so it uses its own electric-lime on dark ground rather than
    the host aaen moss palette. Colors are hardcoded (favicons can't resolve
    CSS variables).
  -->
  <rect width="32" height="32" rx="5" fill="#0e1116"/>
  <!-- faint HUD baseline rule (the instrumented ground) -->
  <rect x="4" y="16.6" width="24" height="0.8" fill="#f0f2f51a"/>
  <!-- ECG trace — electric lime, the recovery spike -->
  <path d="M4 17 H11 L12.5 14 L14 6 L16 24 L17.5 13 L19.5 17 H28"
        fill="none" stroke="#d6ff3a" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- live readout node at the trace's end -->
  <circle cx="28" cy="17" r="1.8" fill="#d6ff3a"/>
</svg>
